[CAN]
interface = vecan0
bitrate = 250000
# Node IDs of batteries on the CAN bus (comma-separated)
node_ids = 1,2,3

[Victron]
service_name_prefix = com.victronenergy.battery.canopen_bms
device_instance_start = 1
product_name = SuperB Epsilon V2 BMS
update_interval = 2.0
mode = individual

[Battery]
capacity = 150
chemistry = LiFePO4
number_of_cells = 4
# Default charge/discharge limits published when BMS PDO/SDO unavailable
# SuperB Epsilon V2 can handle 150A per battery
max_charge_current = 150
max_discharge_current = 150
max_charge_voltage = 14.4
